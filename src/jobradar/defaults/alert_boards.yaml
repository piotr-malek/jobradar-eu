# Big job boards that can't be searched overnight (bot protection, robots.txt or a login wall), so their job-alert
# e-mails are the way in. The wizard lists them for the user's countries. sender = what the alert e-mails come from
# (an IMAP FROM search matches it as a substring); sender_verified: false = the board's own domain, not yet seen on a
# real alert e-mail. Checked 2026-11-09 from a home connection; GitHub's network may be blocked on more of them.
