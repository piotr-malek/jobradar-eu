# Source registry. Each entry → one adapter run; cadence lives here (every_days), not in workflows.
#   runner: github (runs on Actions) | local (home IP only, `jr run --runner local`) | any
#   rank: lower = preferred representative link when the same job appears on several sources
#   default_country / default_workplace: used when a posting carries no location / mode info
#   secrets: env vars required; the source is skipped (status skipped_no_key) until they exist
#   countries: ISO codes the board covers (EU = pan-European or remote board, always on); langs: posting languages besides
#              English (their search terms are added to $terms); opt_in: track the user must switch on (purpose | polish_only);
#              label: short human name
# No role or city is written here: search words come from the active role packs ($terms, $terms:N, $terms_en:N), board
# categories from the packs' `boards:` ($board:<board>.<key>), slug tiers from `prefer:` ($prefer) and the home city from
# profile.yaml ({city}). See jobradar/sources/registry.py for the placeholders.
defaults:
  enabled: true
  every_days: 1
  runner: github
  rank: 50
  politeness: {rps: 0.5, max_requests: 60, browser: false, robots: false}

sources:
  # ------------------------------------------------------------ remote boards (APIs/RSS)
  - id: arbeitnow
    adapter: arbeitnow
    label: Arbeitnow
    countries: [EU]
    rank: 40
    params: {max_pages: 5}
  - id: remotive
    adapter: remotive
    label: Remotive
    countries: [EU]
    default_workplace: remote
    params: {categories: '$board:remotive.categories', queries: '$terms:3'}
    politeness: {max_requests: 4}          # Remotive asks for <= 4 calls/day
  - id: jobicy
    adapter: jobicy
    label: Jobicy
    countries: [EU]
    default_workplace: remote
    politeness: {max_requests: 6}
  - id: himalayas
    adapter: himalayas
    label: Himalayas
    countries: [EU]
    default_workplace: remote
    params: {queries: '$terms:11'}
    politeness: {max_requests: 18}
  - id: remoteok
    adapter: remoteok
    label: Remote OK
    countries: [EU]
    default_workplace: remote
    politeness: {max_requests: 2}
  - id: weworkremotely
    adapter: weworkremotely
    label: We Work Remotely
    countries: [EU]
    enabled: false                           # applying needs a paid WWR subscription
    default_workplace: remote
    politeness: {max_requests: 6, browser: true}
  - id: workingnomads
    adapter: workingnomads
    label: Working Nomads
    countries: [EU]
    default_workplace: remote
    politeness: {max_requests: 2}
  - id: hn_whoishiring
    adapter: hn_whoishiring
    label: Hacker News "Who is hiring"
    countries: [EU]
    every_days: 7
    politeness: {max_requests: 3, rps: 1}
  - id: eighty_k_hours
    adapter: algolia_board
    label: 80,000 Hours job board
    countries: [EU]
    every_days: 3
    params: {board: eighty_k_hours, queries: '$terms:2', max_pages: 2}
    politeness: {max_requests: 6}
  - id: escapethecity
    adapter: algolia_board
    label: Escape the City
    countries: [EU]
    every_days: 3
    params: {board: escapethecity, queries: '$terms:2', max_pages: 2}
    politeness: {max_requests: 6}

  # ------------------------------------------------------------ keyed sources (free tiers, budgets)
  - id: theirstack
    adapter: theirstack
    label: TheirStack
    countries: [EU]
    kind: aggregator
    every_days: 7
    rank: 60
    secrets: [THEIR_STACK_API_KEY]
    params: {limit: 40, per_page: 20, max_age_days: 7, titles: '$terms:6'}  # free tier: 200 credits/month, 1 credit per job, ≤25 per page
    politeness: {max_requests: 2}
  - id: linkedin_apify
    adapter: apify_linkedin
    label: LinkedIn (Apify)
    countries: [EU]
    kind: aggregator
    enabled: false                           # paid source (Apify); LinkedIn comes from its job-alert e-mails, see email_alerts
    every_days: 2
    rank: 55
    secrets: [APIFY_API_KEY]
    notes: "LinkedIn via Apify actor curious_coder/linkedin-jobs-scraper; $0.002/result on the free plan; ~100 results/run (5 searches × 20) every 2 days"
    params: {limit_per_search: 20, keywords: '$terms:5', location: European Union, work_type: remote}
    politeness: {max_requests: 2, rps: 0.2}
  - id: itjobs_pt
    adapter: itjobs_pt
    label: ITJobs.pt
    countries: [PT]
    langs: [pt]
    every_days: 2
    rank: 40
    default_country: PT
    secrets: [ITJOBS_PT_API_KEY]
    params: {queries: '$terms:5'}
    politeness: {max_requests: 6}

  # ------------------------------------------------------------ Polish boards (robots-friendly: sitemap/SSR + JSON-LD)
  # theprotocol.it and Pracuj.pl are behind a Cloudflare managed challenge (not scraped; use their email alerts).
  - id: justjoin
    adapter: sitemap_jsonld
    label: Just Join IT
    countries: [PL]
    every_days: 1
    rank: 40
    runner: github                      # Cloudflare-fronted, not challenged in tests; switch to local if runs report `blocked`
    default_country: PL
    params:
      sitemap_index: https://justjoin.it/sitemaps/active-jobs.xml
      url_include: ['/job-offer/']
      slug_strip: ['-[a-z]+(?:-[0-9a-f]{8})?$']
      group_strip: '-[a-z]+-[a-z]+(?:-[0-9a-f]{8})?$'
      prefer:
        - $prefer
        - {"$each": '$board:justjoin.categories', as: c, template: '-{c}(?:-[0-9a-f]{8})?$'}
      lastmod_days: 30
      max_details: 150                  # cap on NEW postings per run (~900 relevant groups live → backlog drains in ~6 days)
      enrich: justjoin_rsc
      default_currency: PLN
    politeness: {rps: 0.5, max_requests: 160, browser: true, robots: true}
  - id: nofluffjobs
    adapter: nofluffjobs
    label: No Fluff Jobs
    countries: [PL]
    every_days: 1
    rank: 40
    default_country: PL
    params:
      listings:
        - {"$each": '$board:nofluffjobs.categories', as: c, template: 'https://nofluffjobs.com/?criteria=category%3D{c}&page={page}'}
        # the server caps every listing at 100 (by last bump): the packs' slices (remote, home city) see every offer daily
        - {"$each": '$board:nofluffjobs.slices', as: s, template: 'https://nofluffjobs.com/?criteria={s}&page={page}'}
      pages: 5
      max_details: 50
    politeness: {rps: 0.5, max_requests: 60, browser: true, robots: true}
  - id: bulldogjob
    adapter: sitemap_jsonld
    label: Bulldog Job
    countries: [PL]
    every_days: 1
    rank: 40
    default_country: PL
    params:
      sitemap_index: https://bulldogjob.pl/sitemap.xml.gz
      sitemap_include: 'jobs\.xml'
      url_include: ['/companies/jobs/\d+-']
      id_regex: '/companies/jobs/(?P<id>\d+)-'
      slug_regex: '/companies/jobs/\d+-(?P<slug>[^/?#]+)'
      prefer: $prefer
      lastmod_days: 30
      max_details: 40
      enrich: bulldogjob_next
      default_currency: PLN
    politeness: {rps: 0.5, max_requests: 50, browser: true, robots: true}
  - id: solidjobs
    adapter: sitemap_jsonld
    label: Solid.Jobs
    countries: [PL]
    every_days: 1
    rank: 40
    default_country: PL
    params:
      sitemaps: https://solid.jobs/sitemap-offers.xml
      url_include: ['/offer/\d+/']
      id_regex: '/offer/(?P<id>\d+)/'
      slug_regex: '/offer/\d+/(?P<slug>[^/?#]+)'
      prefer: $prefer
      lastmod_days: 30
      max_details: 30
      enrich: solidjobs_ngstate
      default_currency: PLN
    politeness: {rps: 0.5, max_requests: 40, browser: true, robots: true}
  - id: rocketjobs
    adapter: sitemap_jsonld
    label: Rocket Jobs (business roles)
    countries: [PL]
    langs: [pl]
    opt_in: polish_only
    every_days: 2
    rank: 40
    default_country: PL
    params:
      sitemap_index: https://rocketjobs.pl/sitemaps/active-jobs.xml
      url_include: ['/oferta-pracy/']
      slug_strip: ['-[0-9a-f]{8}$', '-bi-data$']
      group_strip: '-[0-9a-f]{8}$'
      prefer: [$prefer, 'marketing|crm|automation|revops|analytics']
      lastmod_days: 30
      max_details: 60
      enrich: justjoin_rsc
      default_currency: PLN
    politeness: {rps: 0.5, max_requests: 70, browser: true, robots: true}

  - id: hays_pl
    adapter: sitemap_jsonld
    label: Hays Poland
    countries: [PL]
    langs: [pl]
    opt_in: polish_only
    every_days: 2
    rank: 50
    default_country: PL
    notes: "recruitment agency (agency flag via matching.yaml); hiringOrganization is always Hays; JSON-LD salary unit can be wrong (DAY vs PLN/h)"
    params:
      sitemaps: https://www.hays.com/sitemap/pl-PL-job-sitemap.xml   # ~400 PL jobs; <loc>/<lastmod> in CDATA
      url_include: ['/pl-PL/oferta-pracy-opis/']
      id_regex: '_(?P<id>\d+)$'
      slug_regex: '/oferta-pracy-opis/(?P<slug>[^/?#]+)_\d+$'
      lastmod_days: 30
      max_details: 30
      default_currency: PLN
    politeness: {rps: 0.3, max_requests: 35, browser: true, robots: true}
  - id: michaelpage_pl
    adapter: sitemap_jsonld
    label: Michael Page Poland
    countries: [PL]
    langs: [pl]
    opt_in: polish_only
    every_days: 2
    rank: 50
    default_country: PL
    notes: "Michael Page PL (agency flag via matching.yaml); keyword listings (all results on one page, no paging) -> job-detail JSON-LD"
    params:
      listing_urls: {"$each": '$board:michaelpage_pl.paths', as: path, template: 'https://www.michaelpage.pl/jobs/{path}'}
      listing_link_regex: '/job-detail/[^/]+/ref/jn-'
      id_regex: '/ref/(?P<id>jn-\d+-\d+)'
      slug_regex: '/job-detail/(?P<slug>[^/?#]+)/ref/'
      slug_strip: ['-it-contracting$']
      prefer: $prefer
      max_details: 20
      default_currency: PLN
    politeness: {rps: 0.3, max_requests: 30, robots: true}
  # ------------------------------------------------------------ national / EU public-employment APIs (official, no key)
  # Mostly local-language and on-site/hybrid; the matcher's language + location rules do the filtering.
  - id: arbeitsagentur
    adapter: arbeitsagentur
    label: Bundesagentur für Arbeit
    countries: [DE]
    langs: [de]
    kind: national
    every_days: 2
    rank: 35
    default_country: DE
    params: {published_within_days: 4, max_pages: 2, max_details: 30,   # homeoffice facet on by default
             searches: '$terms:12'}
    politeness: {rps: 0.5, max_requests: 60}
  - id: jobtech_se
    adapter: jobtech_se
    label: Arbetsförmedlingen (JobTech)
    countries: [SE]
    langs: [sv]
    kind: national
    every_days: 3
    rank: 35
    default_country: SE
    params: {published_within_days: 4, queries: '$terms:11'}
    politeness: {max_requests: 12}
  - id: nav_no
    adapter: nav_feed
    label: NAV (Norway)
    countries: ['NO']
    kind: national
    every_days: 1                            # change feed, ~5.5k changes/day = ~6 pages of 1000 per day
    rank: 35
    default_country: NO
    notes: "change feed; public rotating token unless NAV_FEED_TOKEN is set (free on request)"
    params: {lookback_hours: 26, max_pages: 8, max_details: 20}
    politeness: {rps: 0.5, max_requests: 30}
  - id: eures
    adapter: eures
    label: EURES
    countries: [EU]
    kind: national
    every_days: 2
    rank: 35
    langs: [$country_langs]                  # national employment services post in the local language
    # big where the public employment service feeds EURES (DE FR NL BE AT SE CH SK ES NO FI); ~empty in BG RO GR LT SI HU PT IE CY
    params: {publication_period: LAST_THREE_DAYS, max_pages: 2, keywords: '$terms:12', location_codes: '$countries_lower'}
    politeness: {max_requests: 26}

  # ------------------------------------------------------------ public board APIs (no key)
  - id: themuse
    adapter: themuse
    label: The Muse
    countries: [EU]
    every_days: 2
    params: {max_pages: 8, categories: '$board:themuse.categories'}
    politeness: {max_requests: 10}
  - id: landingjobs
    adapter: landingjobs
    label: Landing.jobs
    countries: [EU]
    every_days: 2
    runner: local                            # Cloudflare 403s GitHub IPs (sitemap); fine from a home IP
    rank: 45
    params: {max_details: 25}                # sitemap + JSON-LD (robots disallows /api/)
    politeness: {rps: 0.3, max_requests: 30, robots: true}
  - id: getonbrd
    adapter: getonbrd
    label: Get on Board
    countries: [EU]
    every_days: 3
    notes: "LATAM-centric; kept for fully-remote roles"
    params: {max_pages: 1, max_age_days: 7}
    politeness: {max_requests: 8}

  # ------------------------------------------------------------ aggregators
  - id: open_jobs_data
    adapter: open_jobs_data
    label: Open Jobs Data
    countries: [EU]
    kind: aggregator
    rank: 15                                 # links are ATS apply URLs
    notes: "ConorsCode/open-jobs-data daily snapshot (new-jobs.json); titles/locations only, no descriptions"
    params: {file: new-jobs.json}
    politeness: {max_requests: 3}
  - id: jooble
    adapter: jooble
    label: Jooble {country_name}
    # one source per Jooble country site; a key works only on the site it was issued for (403 elsewhere)
    each_country: [AT, BE, BG, HR, CZ, DK, FI, FR, DE, GR, HU, IE, IT, NL, PL, PT, RO, SK, ES, SE, 'NO', CH]
    kind: aggregator
    every_days: 1
    rank: 60
    secrets: ['JOOBLE_{CC}_API_KEY']
    notes: "{cc}.jooble.org: republishes national boards we can't fetch (Cloudflare) and company pages"
    params: {host: '{cc}.jooble.org', locations: ['', '{city}'], published_within_days: 3, max_pages: 1, max_calls: 20,
             keywords: '$terms:10'}          # '' = the whole country site; 50/page, 3 days → page 2 rarely needed
    politeness: {max_requests: 22}
  - id: adzuna
    adapter: adzuna
    label: Adzuna
    countries: [AT, BE, DE, ES, FR, IT, NL, PL, CH]
    modes: [full]
    kind: aggregator
    every_days: 1
    rank: 58
    secrets: [ADZUNA_APP_ID, ADZUNA_APP_KEY]
    notes: "free key (developer.adzuna.com); job links must be Adzuna's redirect_url (their terms); ~500-character snippets"
    params: {countries: '$countries_lower', queries: '$terms:8', max_days_old: 3, max_pages: 1, max_calls: 30}
    politeness: {max_requests: 32}
  - id: linkedin_guest
    adapter: linkedin_guest
    label: LinkedIn (guest search)
    countries: [EU]
    kind: aggregator
    enabled: false                           # robots.txt disallows /jobs-guest/; LinkedIn comes from its job-alert e-mails (email_alerts)
    rank: 55
    politeness: {max_requests: 3, rps: 0.2, browser: true, robots: true}
  - id: jobspy_indeed
    adapter: jobspy_indeed
    label: Indeed (JobSpy)
    countries: [EU]
    kind: aggregator
    enabled: false                           # needs `pip install 'jobradar-eu[jobspy]'` (old numpy pin)
    runner: local
    every_days: 2
    rank: 55
    params: {countries: [germany, netherlands, poland], search_terms: '$terms:2',
             is_remote: true, hours_old: 72, results_wanted: 30}

  # ------------------------------------------------------------ regional boards (Nordics, DACH, CZ, CH)
  - id: thehub
    adapter: thehub
    label: The Hub (Nordics)
    countries: [DK, SE, 'NO', FI]
    every_days: 2
    rank: 45
    params: {countries: [EU, DK, SE, 'NO', FI, REMOTE], queries: '$terms:2', max_pages: 2, max_details: 25}
    politeness: {rps: 0.5, max_requests: 55}
  - id: wttj
    adapter: wttj
    label: Welcome to the Jungle
    countries: [FR]
    langs: [fr]
    every_days: 1
    rank: 45
    params: {max_pages: 2, queries: '$terms:11'}
    politeness: {rps: 0.5, max_requests: 30}
  - id: jobsch
    adapter: jobsch
    label: jobs.ch
    countries: [CH]
    langs: [de]
    every_days: 3
    rank: 45
    default_country: CH
    params: {max_pages: 2, max_details: 20, queries: '$terms:8'}
    politeness: {rps: 0.3, max_requests: 40, browser: true, robots: true}
  - id: karriere_at
    adapter: karriere_at
    label: karriere.at
    countries: [AT]
    langs: [de]
    every_days: 3
    rank: 45
    default_country: AT
    params: {max_pages: 3, max_details: 20, keywords: '$terms:8'}
    politeness: {rps: 0.3, max_requests: 45, browser: true, robots: true}
  - id: startupjobs_cz
    adapter: startupjobs_cz
    label: StartupJobs.cz
    countries: [CZ]
    every_days: 3
    rank: 45
    default_country: CZ
    params: {max_pages: 3, max_details: 20, queries: '$terms:3'}
    politeness: {rps: 0.5, max_requests: 30}
  - id: jobindex
    adapter: jobindex
    label: Jobindex
    countries: [DK]
    every_days: 3
    rank: 45
    default_country: DK
    params: {queries: '$terms:4'}
    politeness: {rps: 0.3, max_requests: 6, robots: true}

  # ------------------------------------------------------------ RSS / XML job feeds
  - id: swissdevjobs
    adapter: rss_feed
    label: SwissDevJobs
    countries: [CH]
    every_days: 2
    runner: local                                        # Cloudflare 403s GitHub IPs on and off; fine from a home IP
    rank: 45
    default_country: CH
    params:
      feeds: [https://swissdevjobs.ch/job_feed.xml]      # full IT feed (~200 jobs, full descriptions, salary)
      id_from: link                                      # <id> carries a week suffix (…-W43) → unstable
      company_field: company
      location_field: [city, location]
      country_field: country
      max_items: 2000
    politeness: {max_requests: 2, robots: true}
  - id: germantechjobs
    adapter: rss_feed
    label: GermanTechJobs
    countries: [DE]
    every_days: 2
    rank: 45
    default_country: DE
    params:
      feeds: [https://germantechjobs.de/job_feed.xml]    # full IT feed (~750 jobs, ~3 MB)
      id_from: link
      company_field: company
      location_field: [city, location]
      country_field: country
      max_items: 3000
    politeness: {max_requests: 2, robots: true}
  - id: berlinstartupjobs
    adapter: rss_feed
    label: Berlin Startup Jobs
    countries: [DE]
    every_days: 1
    rank: 45
    default_country: DE
    params:
      feeds: [https://berlinstartupjobs.com/engineering/feed/]
      title_split: {seps: [" // "], company: right}
    politeness: {max_requests: 2, robots: true}

  # ------------------------------------------------------------ cross-company search and purpose-track boards
  # track: purpose → postings get the "purpose" tag and the matcher's purpose rules (UN/EU titles, grade filter);
  # opt_in: purpose → they run only when the user switched the purpose track on.
  - id: workable_search
    adapter: workable_search
    label: Workable job search
    countries: [EU]
    kind: aggregator
    every_days: 2
    rank: 55                                 # no account slug/shortcode in the data, so no ATS dedup key
    notes: "jobs.workable.com cross-company search: full descriptions; Europe + EU/EEA country slices, all English"
    # 20 per page; Workable answered 429 after ~230 calls at 1 rps, so 0.5 rps
    params: {queries: '$terms:8', locations: [Europe, '$country_names'], max_pages: 2, max_calls: 96}
    politeness: {rps: 0.5, max_requests: 100}
  - id: jobgether
    adapter: jobgether
    label: Jobgether
    countries: [EU]
    kind: aggregator
    every_days: 2
    rank: 58                                 # Jobgether republishes employers' jobs; list rows have no description
    notes: "official agents API (robots allows /astroapi/ai/jobs.json, crawl-delay 2); title-only rows"
    params: {locations: [europe, '$country_slugs'], keywords: '$terms:8', max_pages: 2, max_calls: 40}
    politeness: {rps: 0.5, max_requests: 45, robots: true}
  - id: un_careers
    adapter: un_careers
    label: UN Careers
    countries: [EU]
    kind: board
    track: purpose
    opt_in: purpose
    every_days: 2
    rank: 35
    notes: "careers.un.org public JSON list (POST, 100/page, full description in list; INT internships skipped); robots.txt is a CloudFront 403"
    params: {max_pages: 8}
    politeness: {rps: 0.5, max_requests: 12, robots: false}
  - id: eu_careers
    adapter: eu_careers
    label: EU institutions (EPSO)
    countries: [EU]
    kind: board
    track: purpose
    opt_in: purpose
    every_days: 2
    rank: 35
    notes: "EU institutions + agencies; server-rendered list (/jobs_en?page=N, 20/page) + detail pages for title-relevant, unstored vacancies"
    params: {max_pages: 9, max_details: 32}
    politeness: {rps: 0.5, max_requests: 45, robots: true}
  - id: email_alerts
    adapter: email_alerts
    label: Job-alert e-mails (IMAP)
    countries: [EU]
    kind: aggregator
    every_days: 1
    rank: 55
    default_country: '{country}'
    notes: "every job in the mails from the senders listed in the wizard (LinkedIn, boards behind Cloudflare, any board's alerts); no descriptions, links never opened"
    secrets: [JR_IMAP_USER, JR_IMAP_PASSWORD]
    params: {host: imap.gmail.com, folder: INBOX, days: 3, senders: '$alert_senders'}
  # Purpose track: Impactpool (UN/INGO aggregator; job-function + seniority filters, 3 list pages + details)
  - id: impactpool
    adapter: impactpool
    label: Impactpool
    countries: [EU]
    every_days: 2
    rank: 40
    track: purpose
    opt_in: purpose
    params: {max_pages: 3, per_page: 100, max_details: 44}
    politeness: {rps: 0.5, max_requests: 55, robots: true}
  # Purpose track: SAP SuccessFactors career sites of UN agencies (sitemap → detail page, microdata, no JSON-LD)
  - id: itu
    adapter: sf_csb
    label: ITU
    countries: [EU]
    every_days: 3
    rank: 40
    track: purpose
    opt_in: purpose
    params: {host: jobs.itu.int, org: ITU, max_details: 20}
    politeness: {rps: 0.5, max_requests: 25, robots: true}
  - id: unesco
    adapter: sf_csb
    label: UNESCO
    countries: [EU]
    every_days: 3
    rank: 40
    track: purpose
    opt_in: purpose
    params: {host: careers.unesco.org, org: UNESCO, max_details: 20}
    politeness: {rps: 0.5, max_requests: 25, robots: true}
  - id: ilo
    adapter: sf_csb
    label: ILO
    countries: [EU]
    every_days: 3
    rank: 40
    track: purpose
    opt_in: purpose
    params: {host: jobs.ilo.org, org: ILO, max_details: 12}
    politeness: {rps: 0.5, max_requests: 16, robots: true}
  # ------------------------------------------------------------ boards via sitemap + JSON-LD (remote + agencies)
  - id: remoteleaf
    adapter: sitemap_jsonld
    label: RemoteLeaf
    countries: [EU]
    every_days: 2
    rank: 45
    notes: "remote jobs; applicantLocationRequirements -> countries/remote_scope; slug carries the country; USD salaries"
    params:
      sitemaps: https://remoteleaf.com/sitemap-jobs-europe.xml   # 8.4k URLs (many duplicated); robots disallow /api/ and queries only
      url_include: ['/company/[^/]+/[^/]+/$']
      id_regex: '/company/(?P<id>[^/]+/[^/]+)/$'
      slug_regex: '/company/[^/]+/(?P<slug>[^/?#]+)/$'
      prefer: $prefer
      lastmod_days: 30
      max_details: 40
    politeness: {rps: 0.5, max_requests: 45, robots: true}
  - id: sii_pl
    adapter: sitemap_jsonld
