  # ------------------------------------------------------------ role-specific boards (only useful for the matching packs)
  - id: revpath
    packs: [gtm-revops]
    adapter: sitemap_jsonld
    label: RevPath (RevOps / GTM jobs)
    countries: [EU]
    every_days: 1
    rank: 50
    kind: aggregator
    notes: "revpath.dealhub.io (DealHub): RevOps/GTM-only board, ~8.8k jobs, US-heavy with UK/EU; 3 job sitemaps without lastmod, numeric ids grow with recency; JobPosting JSON-LD; apply links go to the company"
    # ~1k slugs pass the title gate on the first run; newest ids first, older ones drain over later runs
    params:
      sitemaps: [https://revpath.dealhub.io/sitemap-jobs-1.xml, https://revpath.dealhub.io/sitemap-jobs-2.xml,
                 https://revpath.dealhub.io/sitemap-jobs-3.xml]
      url_include: ['/jobs/\d+-']
      id_regex: '/jobs/(?P<id>\d+)-'
      slug_strip: ['^\d+-']             # the id stays in the slug, so same-titled jobs aren't grouped as one
      newest_id_first: true
      max_details: 60
    politeness: {rps: 1, max_requests: 70, robots: true}   # robots: crawl-delay 1, only /rss/ disallowed
  - id: getdataengineeringjobs
    packs: [data]
    adapter: sitemap_jsonld
    label: GetDataEngineeringJobs
    countries: [EU]
    every_days: 1
    rank: 55
    kind: aggregator
    notes: "getdataengineeringjobs.com: data-engineering jobs only, aggregated from ATS boards and job boards; listing filters (EU countries, remote open to the home country, last 7 days) -> JobPosting JSON-LD + facts list (work mode, remote eligibility); links are the board's page (robots disallow its /apply/ redirect)"
    # the sitemap (~4.9k jobs) has no usable lastmod and no location in the slug, so the filtered listings are cheaper.
    # nsform=1 drops jobs without a stated location from the country listing (mostly US); remote_in keeps
    # remote jobs with no stated restriction
    params:
      listing_urls:
        - 'https://getdataengineeringjobs.com/?remote_in={country}&posted=7&page={page}'
        - https://getdataengineeringjobs.com/?country=pl&country=de&country=fr&country=nl&country=es&country=pt&country=ro&country=be&country=bg&country=se&country=hu&country=it&country=cz&country=gr&country=lt&country=ie&country=no&country=at&country=dk&country=fi&country=sk&country=si&country=hr&country=ee&country=lv&country=lu&country=ch&posted=7&nsform=1&nosalary=1&page={page}
      listing_pages: 12
      listing_link_regex: '^/jobs/\d+-'
      id_regex: '/jobs/(?P<id>\d+)-'
      slug_strip: ['^\d+-']             # the id stays in the slug, so multi-city copies aren't grouped as one
      newest_id_first: true
      max_details: 40
      enrich: gdej_facts                # work mode + remote eligibility from the page's facts list
    politeness: {rps: 0.5, max_requests: 60, robots: true}
