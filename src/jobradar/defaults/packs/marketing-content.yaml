# Role pack: marketing, communications and content (any employer). Marketing ops / automation engineering is gtm-revops.
label: Marketing & content
description: Digital, performance and growth marketing, SEO / SEM / paid ads, social media, brand, PR and communications, events, copywriting, content and editing.
domain: business

families:
  marketing:
    tier: core
    priority: 30
    label: Marketing
    manager_ok: true            # "Marketing Manager" is usually an individual role
    any:
      - marketing (?:manager|specialist|executive|coordinator|associate|lead|consultant|strategist|analyst|assistant|officer|generalist|partner|expert)
      - '(?:digital|online|performance|growth|product|brand|content|social media|e-?mail|crm|lifecycle|retention|field|event|partner|channel|b2b|b2c|demand generation|influencer|affiliate|community|seo|search|ppc|paid|inbound|account[- ]based|abm|customer|marketplace|app|mobile) marketing(?: (?:manager|specialist|executive|coordinator|associate|lead|consultant|strategist|analyst|assistant|officer|expert))?'
      - marketer|marketeer
      - (?:growth|demand generation|acquisition|user acquisition|lifecycle|retention) (?:manager|specialist|lead|marketer|strategist)
      - (?:brand|communications?|comms|corporate communications|internal communications|pr|public relations|media relations|campaign|campaigns|events?|community|social media|influencer|partnerships?) (?:manager|specialist|executive|coordinator|lead|officer|strategist|associate|consultant)
      - (?:seo|sem|ppc|paid (?:search|social|media|ads)|performance|programmatic|google ads|ads|media buying|aso) (?:specialist|manager|lead|analyst|consultant|expert|strategist|executive|buyer|marketer)
      - media (?:buyer|planner)|community manager|social media (?:editor|creator)|spokesperson|press officer
      - specjalist\w* (?:ds\.? )?(?:marketingu|seo|sem|ppc|komunikacji|pr|social media|e-?commerce|kampanii|reklamy)\w*|marketingowiec|kierownik\w* (?:ds\.? )?marketingu|menedzer\w* (?:ds\.? )?marketingu|mlodszy specjalista ds\.? marketingu
      - (?:online[- ]?)?marketing[- ]?(?:manager|referent\w*|spezialist\w*|koordinator\w*|mitarbeiter\w*)|marketingreferent\w*|referent\w* (?:fur |im )?marketing|kommunikations(?:manager|referent)\w*|pressesprecher\w*|social[- ]media[- ]manager\w*|performance[- ]marketing\w*
      - (?:especialista|tecnico|responsable|gestor\w*|coordinador\w*|ejecutiv\w*) (?:de |en )?(?:marketing|comunicacion|redes sociales|seo|sem)\w*
      - (?:especialista|analista|gestor\w*|coordenador\w*|assistente) (?:de |em )?(?:marketing|comunicacao|redes sociais|seo)\w*
      - charge\w* (?:de )?(?:marketing|communication|relations presse)|responsable (?:marketing|communication|acquisition|seo)|chef de projet (?:marketing|communication|digital)
      - (?:specialista|responsabile|addett\w*) (?:marketing|comunicazione|seo)|online marketeer|marketing medewerker|marknadsforare|marknadskoordinator
  content:
    tier: core
    priority: 29
    label: Content & copywriting
    manager_ok: true
    any:
      - copywriter|copy ?writer|content (?:writer|creator|marketer|manager|strategist|editor|specialist|lead|producer|designer|coordinator|marketing manager)
      - (?:technical|ux|creative|proposal|grant|medical|seo|freelance) writer|ghostwriter|proofreader|copy ?editor|managing editor|sub-?editor
      - '(?:senior |junior )?editor(?! in chief)(?: \(m/w/d\))?|editorial (?:manager|assistant|lead|coordinator)'
      - redaktor\w*|teksciarz|tekstopisarz|texter\w*|redacteur\w*|redactor\w*|redator\w*|redattore|copywriter\w*|tekstschrijver
      - (?:social media|video|podcast) (?:producer|creator|editor)|content creator|ugc creator|storyteller

family_exclude: ['telemarketing', 'network marketing', 'multi[- ]level', 'mlm', 'door[- ]to[- ]door', 'promoter',
                 'brand ambassador', 'store', 'shop assistant', 'retail', 'merchandis\w*', 'cashier', 'call cent\w*',
