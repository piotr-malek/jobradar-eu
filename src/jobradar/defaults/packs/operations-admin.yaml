         Specjalista ds. Administracji, Asystentka Zarządu, Kierownik Projektu, Specjalista ds. Zakupów,
         Specjalistka ds. Logistyki, Spedytor, Projektmanager (m/w/d), Assistenz der Geschäftsführung (m/w/d),
         Einkäufer (m/w/d), Sachbearbeiter Einkauf (m/w/d), Administrativo, Asistente de Dirección, Jefe de Proyecto,
         Técnico de Compras, Assistente Administrativo, Gestor de Projetos, Assistant de direction, Chef de projet,
         Acheteur, Projectleider, Inkoper, Projektledare]
