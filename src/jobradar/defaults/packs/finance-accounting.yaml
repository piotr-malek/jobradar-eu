golden:
  keep: [Accountant, Senior Accountant, Management Accountant, Chartered Accountant, Bookkeeper,
         Accounts Payable Specialist, Accounts Receivable Specialist, AP/AR Specialist, General Ledger Accountant,
         Billing Specialist, Credit Controller, Accounting Manager, Financial Analyst, FP&A Analyst, Senior FP&A Analyst,
         Financial Controller, Finance Business Partner, Business Controller, Treasury Analyst, Tax Advisor,
         Tax Specialist, Internal Auditor, Audit Associate, Finance Manager, Payroll Accountant, Revenue Accountant,
         Księgowa, Samodzielna Księgowa, Specjalista ds. Księgowości, Analityk Finansowy, Specjalista ds. Controllingu,
         Controller Finansowy, Buchhalter (m/w/d), Finanzbuchhalter (m/w/d), Controller (m/w/d), Bilanzbuchhalter,
         Contable, Analista Financiero, Técnico de Contabilidad, Comptable, Contrôleur de gestion, Analyste financier,
         Contabilista, Analista Financeiro, Boekhouder, Redovisningsekonom]
  drop: [Backend Developer, Data Engineer, Bank Teller, Insurance Sales Agent, Financial Advisor, Mortgage Advisor,
         Cashier, Air Traffic Controller, Quality Controller, Stock Controller, CFO, Finance Director, Head of Finance,
         Accounting Intern, Marketing Manager, Recruiter, Nurse, Software Engineer]
