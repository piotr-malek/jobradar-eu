[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar-eu"
version = "0.1.0"
description = "Your IT job shortlist every morning: job boards and company career pages across Europe, matched overnight on GitHub Actions; pick and apply in a local app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "python-dotenv>=1",
    "jinja2>=3.1",
    "flask>=3",
    "pypdf>=4",
    "python-docx>=1.1",
    "tzdata; sys_platform == 'win32'",      # Windows has no time-zone database for zoneinfo
]

[project.optional-dependencies]
full = ["playwright>=1.45"]
jobspy = ["python-jobspy"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.urls]
Homepage = "https://github.com/piotr-malek/jobradar-eu"
Issues = "https://github.com/piotr-malek/jobradar-eu/issues"

[project.scripts]
jr = "jobradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["defaults/*.yaml", "defaults/*.md", "defaults/*.csv.gz", "defaults/packs/*.yaml", "normalize/data/*",
            "app/templates/*.html", "app/templates/setup/*.html", "app/static/*", "apply/templates/*",
            "extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the network (run with -m live)",
]
addopts = "-m 'not live'"
