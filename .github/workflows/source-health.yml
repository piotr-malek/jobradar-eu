# Weekly: dry-run every source from GitHub's network and keep one open issue (label: source-health) up to date.
name: source-health

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JR_USER_DIR: ${{ github.workspace }}/examples/lisbon-backend/user
      JR_HOME: ${{ runner.temp }}/jr
      JR_RUNNER: github
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Check every source
        run: python scripts/source_health.py "$RUNNER_TEMP/report.md" --minutes 40
      - name: Update the source-health issue
        shell: bash
        run: |
          gh label create source-health --color B60205 --description "Weekly source check" 2>/dev/null || true
          NUM=$(gh issue list --label source-health --state open --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "Source health" --label source-health --body-file "$RUNNER_TEMP/report.md"
          fi
